spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:moment_sync}
    username: ${DB_USERNAME:moment_sync}
    password: ${DB_PASSWORD}

moment:
  media:
    directory: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080}
  campus:
    moods: ${CAMPUS_MOODS:开心,平静,期待,充实,疲惫,难过}
    locations: ${CAMPUS_LOCATIONS:图书馆,运动场,活动中心,教学楼,食堂,宿舍}
  auth:
    issuer: ${JWT_ISSUER:moment-sync}
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
